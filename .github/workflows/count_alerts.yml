name: Count Alerts

on:
  push:
    paths:
      - 'Malware/**'
      - 'Phishing/**'

jobs:
  count:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Count Malware alerts
        run: |
          COUNT=$(find Malware -name "*.md" ! -name "README.md" | wc -l)
          echo "Malware: $COUNT"
          mkdir -p .badges
          echo '{"schemaVersion":1,"label":"Alertes répertoriées","message":"'$COUNT'","color":"4a9eff"}' > .badges/malware.json

      - name: Commit badge data
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add .badges/
          git diff --staged --quiet || git commit -m "Update alert count badges"
          git push
